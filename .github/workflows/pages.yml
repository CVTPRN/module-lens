name: Refresh catalog and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_catalog:
        description: Refresh module versions from upstream GitHub repositories
        type: boolean
        default: true
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - name: Preserve immutable snapshot cache across daily refreshes
        uses: actions/cache@v4
        with:
          path: web/data
          key: modulelens-v1-${{ hashFiles('modules.json', 'collector/**') }}-${{ github.run_id }}
          restore-keys: |
            modulelens-v1-${{ hashFiles('modules.json', 'collector/**') }}-
      - name: Index public module versions
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m collector.collect
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: npm test
      - run: node --check web/app.js
      - run: node --check web/registry-app.js
      - run: node --check server/registry-proxy.js
      - run: python scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
